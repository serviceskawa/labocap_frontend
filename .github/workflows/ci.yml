name: Tests

# Même rôle que `ci.yml` de l'API : lint, tests et build sur chaque PR vers
# develop ou main (lot 9). deploy.yml refait ces étapes avant de déployer main.
on:
  pull_request:
    branches: [develop, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dépendances de production seulement : voir le commentaire de deploy.yml.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npm run build
