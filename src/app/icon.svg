<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>AnapathLab</title>
  <!--
    Favicon et icône d'application — fichier livré avec la charte v1
    (`anapathlab-icon.svg`), repris tel quel.

    La pastille pleine est nécessaire : un onglet pose le favicon sur fond clair
    comme sombre, et l'anneau seul y disparaîtrait une fois sur deux. C'est
    aussi ce que la charte prescrit pour l'icône mobile — « fond cyan plein,
    sans transparence ».

    L'anneau est ici tracé en papier plutôt qu'en cyan, et le noyau éclairci :
    à 16 px, le contraste anneau/fond doit être maximal, sans quoi la lentille
    se referme en disque plein.

    Convention App Router : ce fichier suffit, Next.js pose lui-même le <link>.
  -->
  <rect width="64" height="64" rx="14" fill="#006786" />
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f3f2f2" stroke-width="6" />
  <circle cx="38" cy="27" r="8" fill="#99e0ff" />
</svg>
