services:
  # ─── Frontend Next.js (standalone) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL de l'API injectée AU BUILD (variables NEXT_PUBLIC_* figées à la
        # compilation). Doit pointer vers l'API telle qu'accessible côté navigateur.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: labo-anapath-frontend:1.0.0
    container_name: labo-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Content Security Policy (cf. docs/csp.md). Variable lue AU RUNTIME par
      # le proxy — contrairement aux NEXT_PUBLIC_*, elle ne nécessite pas de
      # reconstruire l'image : un `docker compose up -d` suffit à basculer.
      #   absente / false → Content-Security-Policy-Report-Only (observation)
      #   true            → Content-Security-Policy (blocage effectif)
      CSP_ENFORCE: ${CSP_ENFORCE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
